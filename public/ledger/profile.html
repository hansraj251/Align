<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Profile - Ledger</title>

    <link
        rel="stylesheet"
        href="css/ledger.css"
    >

</head>

<body>

    <div class="app-shell">

        <header class="topbar">

            <button
                id="ledgerSidebarButton"
                class="sidebar-menu-button"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>

            <div class="section-heading">

                <div>

                    <h1>Profile</h1>

                </div>

            </div>

        </header>

        <main class="content">

            <section class="profile-section">

                <div class="profile-card">


                    <div class="profile-avatar">
                        <img
                            id="profilePhoto"
                            alt="Profile photo"
                            hidden
                        >

                        <span id="profileInitial">A</span>
                    </div>

                    <div class="profile-heading">




                        <h2 id="profileDisplayName">
                            Profile
                        </h2>

                        <p id="profileDisplayEmail">
                            -
                        </p>

                        <button
                            id="profilePhotoButton"
                            type="button"
                            class="secondary-button"
                        >
                            Change Photo
                        </button>

                        <input
                            id="profilePhotoInput"
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            hidden
                        >

                        <p
                            id="profilePhotoMessage"
                            class="form-error"
                            hidden
                        ></p>

                    </div>

                </div>

                <form
                    id="profileForm"
                    class="profile-form"
                >

                    <label>

                        Name

                        <input
                            id="profileName"
                            type="text"
                            required
                            maxlength="100"
                            autocomplete="name"
                        >

                    </label>

                    <label>

                        Mobile

                        <input
                            id="profileMobile"
                            type="tel"
                            required
                            maxlength="20"
                            autocomplete="tel"
                        >

                    </label>

                    <label>

                        Email

                        <input
                            id="profileEmail"
                            type="email"
                            readonly
                            disabled
                        >

                    </label>

                    <div class="form-actions">

                        <button
                            id="profileCancelButton"
                            type="button"
                            class="secondary-button"
                        >
                            Cancel
                        </button>

                        <button
                            id="profileSaveButton"
                            type="submit"
                            class="primary-button"
                        >
                            Save Changes
                        </button>

                    </div>

                    <p
                        id="profileFormMessage"
                        class="form-error"
                        hidden
                    ></p>

                </form>

            </section>

            <section
                id="profileQrSection"
                class="profile-section"
            >
                <div class="profile-card">
                    <div class="profile-heading">
                        <h2>
                            My QR Code
                        </h2>
                        <p>
                            Scan this QR code to add me to a Ledger group.
                        </p>
                    </div>
                </div>

                <div
                    class="profile-qr-container"
                    id="profileQrContainer"
                >
                    <p
                        id="profileQrMessage"
                        class="form-error"
                        hidden
                    ></p>

                    <img
                        id="profileQrImage"
                        alt="My Ledger QR code"
                        hidden
                    >

                    <button
                        id="profileQrRefreshButton"
                        type="button"
                        class="secondary-button"
                    >
                        Refresh QR
                    </button>
                </div>
            </section>

        </main>

    </div>

    <div
        id="profileCropModal"
        class="modal-backdrop"
        hidden
    >
        <div
            class="modal profile-crop-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="profileCropTitle"
        >
            <div class="modal-header">
                <div>
                    <h2 id="profileCropTitle">
                        Adjust Profile Photo
                    </h2>
                    <p>
                        Move and zoom the photo inside the square.
                    </p>
                </div>

                <button
                    id="profileCropClose"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>
            </div>

            <div
                id="profileCropArea"
                class="profile-crop-area"
            >
                <img
                    id="profileCropImage"
                    alt="Adjust profile photo"
                    draggable="false"
                >
            </div>

            <div class="profile-crop-controls">
                <button
                    id="profileCropZoomOut"
                    class="secondary-button"
                    type="button"
                >
                    −
                </button>

                <input
                    id="profileCropZoom"
                    type="range"
                    min="1"
                    max="3"
                    step="0.01"
                    value="1"
                    aria-label="Zoom"
                >

                <button
                    id="profileCropZoomIn"
                    class="secondary-button"
                    type="button"
                >
                    +
                </button>
            </div>

            <div class="form-actions">
                <button
                    id="profileCropCancel"
                    class="secondary-button"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="profileCropApply"
                    class="primary-button"
                    type="button"
                >
                    Use Photo
                </button>
            </div>

            <p
                id="profileCropMessage"
                class="form-error"
                hidden
            ></p>
        </div>
    </div>


    <div
        id="ledgerSidebarOverlay"
        class="ledger-sidebar-overlay"
        hidden
    ></div>

    <aside
        id="ledgerSidebar"
        class="ledger-sidebar"
        aria-label="Align menu"
    >

        <div class="ledger-sidebar-header">

            <strong>Align</strong>

            <button
                id="ledgerSidebarClose"
                class="modal-close"
                type="button"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>

        <div class="ledger-sidebar-content">
        <button
                id="ledgerProfileButton"
                class="ledger-sidebar-item selected"
                type="button"
            >
                <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
    </svg>
                <span>Profile</span>
        </button>
        <br>
        <a
          href="/ledger/index.html"
          class="ledger-sidebar-item"

        ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 6h8"/>
      <path d="M8 10h8"/>
      <path d="M8 14h5"/>
    </svg>
          <span>Ledger</span>
        </a>
        <br>
        <a
          href="/ledger/sharing.html"
          class="ledger-sidebar-item"

        ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
          <span>Groups</span>
        </a>


        </div>

        <div class="ledger-sidebar-footer">

            <button
                id="ledgerSidebarLogout"
                class="ledger-sidebar-logout"
                type="button"
            >
                <span class="nav-icon">↪</span>
                <span>Logout</span>
            </button>

        </div>

    </aside>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/profile.js"></script>

</body>

</html>
