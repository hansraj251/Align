<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sharing - Ledger</title>
  <link rel="stylesheet" href="/ledger/css/ledger.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">

      <button
        id="ledgerSidebarButton"
        class="sidebar-menu-button"
        type="button"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div class="section-heading">

        <div style="display:flex; align-items:center; gap:12px;">
          <button
            id="headerAddGroupButton"
            class="header-group-button"
            type="button"
            aria-label="Create Group"
          >
            <span class="nav-icon">＋</span>
          </button>

          <button id="headerGroupsButton" class="header-group-button" type="button" aria-label="Groups">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </button>
        </div>
      </div>
        </header>

    <main class="content">
      <section id="sharingLoading" class="empty-state">
        <h2>Loading sharing...</h2>
      </section>

      <section id="sharingError" class="empty-state" hidden>
        <h2>Unable to load sharing</h2>
        <p></p>
      </section>

      <section id="invitationsSection" hidden>
        <div class="section-heading">
          <div>
            <h1>Pending Invitations</h1>
            <p>Group invitations waiting for your response.</p>
          </div>
        </div>

        <div id="invitationsList" class="parties-list"></div>
      </section>

      <section id="groupsSection" hidden>
        <div id="groupsList" class="parties-list"></div>

        <div id="groupsEmptyState" class="empty-state" hidden>
          <div class="empty-icon">＋</div>
          <h2>No sharing groups yet</h2>
          <p>Create a group to start sharing expenses.</p>
          <button id="emptyCreateGroupButton" type="button">
            Create Group
          </button>
        </div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav2">
    <button class="nav-item" type="button" data-nav="parties" onclick="window.location.href='/ledger/index.html'">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 6h8"/>
      <path d="M8 10h8"/>
      <path d="M8 14h5"/>
    </svg>
      <span> Ledger </span>
    </button>

    <button class="nav-item selected" type="button" data-nav="sharing" onclick="window.location.reload()">
      <span class="nav-icon">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
  </span>
      <span>Groups</span>
    </button>

  </nav>


    <div
      id="ledgerSidebarOverlay"
      class="ledger-sidebar-overlay"
      hidden
    ></div>

    <aside
      id="ledgerSidebar"
      class="ledger-sidebar"
      aria-label="Align menu"
    >
      <div class="ledger-sidebar-header">
        <strong>Align</strong>
        <button
          id="ledgerSidebarClose"
          class="modal-close"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>
      </div>

      <div class="ledger-sidebar-content">
        <button
                id="ledgerProfileButton"
                class="ledger-sidebar-item"
                type="button"
            >
                <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
    </svg>
                <span>Profile</span>
        </button>
        <br>
        <a
          href="/ledger/index.html"
          class="ledger-sidebar-item"

        ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 6h8"/>
      <path d="M8 10h8"/>
      <path d="M8 14h5"/>
    </svg>
          <span>Ledger</span>
        </a>
        <br>
        <a
          href="/ledger/sharing.html"
          class="ledger-sidebar-item selected"

        ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
          <span>Groups</span>
        </a>
      </div>

      <div class="ledger-sidebar-footer">
        <button
          id="ledgerSidebarLogout"
          class="ledger-sidebar-logout"
          type="button"
        >
          <span class="nav-icon">↪</span>
          <span>Logout</span>
        </button>
      </div>
    </aside>

  <div class="modal-backdrop" id="createGroupModal" hidden>
    <div
      class="modal create-group-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="createGroupModalTitle"
    >
      <div class="modal-header">
        <div>
          <h2 id="createGroupModalTitle">Create Group</h2>
          <p>Create a group for sharing expenses.</p>
        </div>

        <button
          id="closeCreateGroupModal"
          class="modal-close"
          type="button"
        >
          ×
        </button>
      </div>

      <form id="createGroupForm">
        <label>
          Group Name
          <input
            id="groupName"
            type="text"
            required
            maxlength="150"
            autocomplete="off"
          >
        </label>

        <label>
          Group Type
          <select
            id="groupDescription"
            required
          >
            <option value="">Select group type</option>
            <option value="Trip / Travel">Trip / Travel</option>
            <option value="Friends">Friends</option>
            <option value="Family">Family</option>
            <option value="Roommates">Roommates</option>
            <option value="Couples">Couples</option>
            <option value="Office / Work">Office / Work</option>
            <option value="Event / Party">Event / Party</option>
            <option value="Business">Business</option>
            <option value="Other">Other</option>
          </select>
        </label>

        <div class="form-actions">
          <button
            id="cancelCreateGroupButton"
            type="button"
            class="secondary-button"
          >
            Cancel
          </button>

          <button
            id="createGroupSubmitButton"
            type="submit"
            class="primary-button"
          >
            Create Group
          </button>
        </div>

        <p id="createGroupFormError" class="form-error" hidden></p>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/ledger/js/sidebar.js"></script>
  <script src="/ledger/js/sharing.js"></script>
</body>
</html>
