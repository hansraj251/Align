<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ledger</title>
  <link rel="stylesheet" href="/ledger/css/ledger.css">
</head>
<body>
  <div class="app-shell">

    <header class="topbar">
      <button
        id="ledgerSidebarButton"
        class="sidebar-menu-button"
        type="button"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div class="ledger-book-wrap">
        <button class="ledger-book-button" id="ledgerBookButton" type="button">
          <span>

            <strong id="selectedBookName">Ledger Book</strong>
          </span>
          <span class="chevron">⌄</span>
        </button>

        <div class="book-menu" id="bookMenu" hidden>
          <div class="book-menu-title">Ledger Books</div>
          <button class="book-option active" type="button">
            <span>Ledger Book</span>
            <span>✓</span>
          </button>
          <div class="book-divider"></div>
          <button class="create-book" id="createBookButton" type="button">
            <span>＋</span>
            <span>Create new Ledger</span>
          </button>
        </div>
      </div>

    </header>

    <main class="content">

      <section class="summary-grid">
        <article class="summary-card get-card">
          <span class="summary-label">YOU WILL GIVE</span>
          <strong id="receivableAmount">₹0.00</strong>
        </article>

        <article class="summary-card give-card">
          <span class="summary-label">YOU WILL GET</span>
          <strong id="payableAmount">₹0.00</strong>
        </article>
      </section>

      <div class="search-reports-row">


        <section class="search-section">


          <div class="search-box">


            <span class="search-icon">⌕</span>


            <input


              id="partySearch"


              type="search"


              placeholder="Search party"


              autocomplete="off"


            >


            <button id="clearSearch" class="clear-search" type="button" hidden>×</button>


          </div>


        </section>



        <button class="reports-button" id="reportsButton" type="button">


          <span>Reports</span>


          <span>›</span>


        </button>


      </div>

      <section class="parties-section">
        <div class="section-heading">
          <div>

            <p id="partyCountText" hidden>Your ledger accounts</p>
          </div>
        </div>

        <div id="partiesList" class="parties-list"></div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">＋</div>
          <h2>No parties yet</h2>
          <p>Add a customer, supplier or other.</p>
          <button id="emptyAddPartyButton" type="button">Add</button>
        </div>

        <div id="noSearchResults" class="empty-state compact" hidden>
          <h2>No party found</h2>
          <p>Try a different name or mobile number.</p>
        </div>
      </section>

    </main>

    <nav class="bottom-nav">
      <button class="nav-item selected" type="button" data-nav="parties">
  <span class="nav-icon">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 6h8"/>
      <path d="M8 10h8"/>
      <path d="M8 14h5"/>
    </svg>
  </span>
  <span>Ledger</span>
</button>
      <button
    class="nav-item"
    type="button"
    id="bottomAddPartyButton"
    >
    <span class="nav-icon">＋</span>
    <span>Add Party</span>
  </button>

      <button class="nav-item" type="button" data-nav="sharing">
  <span class="nav-icon">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
  </span>
  <span>Groups</span>
</button>
    </nav>

  </div>


    <div
      id="ledgerSidebarOverlay"
      class="ledger-sidebar-overlay"
      hidden
    ></div>

    <aside
      id="ledgerSidebar"
      class="ledger-sidebar"
      aria-label="Align menu"
    >
      <div class="ledger-sidebar-header">
        <strong>Align</strong>
        <button
          id="ledgerSidebarClose"
          class="modal-close"
          type="button"
          aria-label="Close menu"
        >
          ×
        </button>
      </div>

      <div class="ledger-sidebar-content">
       <button
                id="ledgerProfileButton"
                class="ledger-sidebar-item"
                type="button"
            >
                <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
    </svg>
                <span>Profile</span>
        </button>
        <br>
        <a
          href="/ledger/index.html"
          class="ledger-sidebar-item selected"

        ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      <path d="M8 6h8"/>
      <path d="M8 10h8"/>
      <path d="M8 14h5"/>
    </svg>
          <span>Ledger</span>
        </a>
        <br>
        <a
          href="/ledger/sharing.html"
          class="ledger-sidebar-item"

        ><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
          <span>Groups</span>
        </a>
      </div>

      <div class="ledger-sidebar-footer">
        <button
          id="ledgerSidebarLogout"
          class="ledger-sidebar-logout"
          type="button"
        >
          <span class="nav-icon">↪</span>
          <span>Logout</span>
        </button>
      </div>
    </aside>

  <div class="modal-backdrop" id="partyModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="partyModalTitle">
      <div class="modal-header">
        <div>
          <h2 id="partyModalTitle">Add</h2>
          <p>Add a customer, supplier or other.</p>
        </div>
        <button id="closePartyModal" class="modal-close" type="button">×</button>
      </div>

      <form id="partyForm">
        <label>
          Name
          <input id="partyName" type="text" required maxlength="100" autocomplete="name">
        </label>

        <label>
          Mobile
          <input id="partyMobile" type="tel" maxlength="20" autocomplete="tel">
        </label>

        <label>
          Mail Address (Required for sharing reports)
          <input id="partyEmail" type="email" maxlength="150" autocomplete="email">
        </label>

        <label>
          Address
          <textarea id="partyAddress" rows="3" maxlength="250"></textarea>
        </label>

        <div class="form-actions">
          <button id="cancelPartyButton" type="button" class="secondary-button">Cancel</button>
          <button type="submit" class="primary-button">Save</button>
        </div>

        <p id="partyFormError" class="form-error" hidden></p>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/ledger/js/sidebar.js"></script>
  <script src="/ledger/js/ledger.js"></script>
</body>
</html>
