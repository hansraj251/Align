<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Party Khata - Ledger</title>
  <link rel="stylesheet" href="/ledger/css/ledger.css">

</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="/ledger/index.html" class="ledger-book-button" style="text-decoration:none;">
        <span>
          <strong>←</strong>
        </span>
      </a>
      <div class="section-heading">
          <div id="partyHeaderDetails" class="party-header-details" role="button" tabindex="0" aria-label="Party actions">
            <h1 id="partyName"></h1>
            <p id="partyMobile"></p>
          </div>
          <div id="partyHeaderActions" class="party-header-actions" hidden>
            <button
              type="button"
              class="secondary-button"
              data-action="edit-party"
              id="editPartyButton"
            >
              ✎
            </button>
            <button
              type="button"
              class="secondary-button"
              data-action="delete-party"
              id="deletePartyButton"
            >
              ×
            </button>
          </div>
        </div>
    </header>

    <main class="content">
      <section id="partyLoading" class="empty-state">
        <h2>Loading party...</h2>
      </section>

      <section id="partyError" class="empty-state" hidden>
        <h2>Unable to load party</h2>
        <p></p>
      </section>

      <section id="partyDetails" hidden>

        <div class="party-summary-cards">
          <article class="summary-card get-card">
            <span class="summary-label" id="partyBalanceLabel">BALANCE</span>
            <strong id="partyBalance">₹0.00</strong>
          </article>

          <article class="summary-card interest-card" id="interestReceivedCard" role="button" tabindex="0" aria-label="Interest Received">
    <span class="summary-label" id="partyInterestLabel">INT.</span>
    <strong id="partyInterest">₹0.00</strong>
        </article>
        </div>

        <button
          class="floating-add"
          id="addTransactionButton"
          type="button"
          aria-label="Add Transaction"
        >
          ＋
        </button>

        <section class="parties-section" style="margin-top:24px;">

          <div id="transactionsList" class="parties-list"></div>
        </section>
      </section>

      <div class="modal-backdrop" id="transactionModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="transactionModalTitle">
          <div class="modal-header">
            <div>
              <h2 id="transactionModalTitle">Add Transaction</h2>
              <p>Record money given or received from this party.</p>
            </div>
            <button id="closeTransactionModal" class="modal-close" type="button">×</button>
          </div>

          <form id="transactionForm">
            <div class="transaction-type-field">
              <span class="transaction-type-label"></span>
              <div class="transaction-type-buttons" role="group" aria-label="Transaction Type">
                <button
                  type="button"
                  class="transaction-type-button"
                  data-transaction-type="debit"
                  aria-pressed="false"
                >YOU GAVE</button>
                <button
                  type="button"
                  class="transaction-type-button"
                  data-transaction-type="credit"
                  aria-pressed="false"
                >YOU GOT</button>
              </div>
              <input type="hidden" id="transactionType" value="debit" required>
            </div>

            <label>
              Amount
              <input id="transactionAmount" type="number" min="0.01" step="0.01" required>
            </label>

            <label>
              Date
              <input id="transactionDate" type="date" required>
            </label>

            <label>
              Interest Rate (% p.a.)
              <input
                id="transactionInterestRate"
                type="number"
                min="0"
                step="0.01"
                value="0"
                required
              >
            </label>

            <label>
              Note
              <textarea id="transactionDescription" rows="3" maxlength="40"></textarea>
            </label>

            <div class="form-actions">
              <button id="cancelTransactionButton" type="button" class="secondary-button">Cancel</button>
              <button id="transactionSubmitButton" type="submit" class="primary-button">Save Transaction</button>
            </div>
            <button
              id="deleteTransactionButton"
              type="button"
              class="transaction-modal-delete-button"
              hidden
            >
              Delete Transaction
            </button>

            <p id="transactionFormError" class="form-error" hidden></p>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="interestReceivedModal" hidden>
    <div class="modal interest-received-modal" role="dialog" aria-modal="true" aria-labelledby="interestReceivedModalTitle">
      <div class="modal-header">
        <div>
          <h2 id="interestReceivedModalTitle">Interest</h2>
          <p>Total received/paid interest.</p>
        </div>
        <button id="closeInterestReceivedModal" class="modal-close" type="button">×</button>
      </div>

      <div class="interest-received-total">
        <span>Total Interest Received/Paid</span>
        <strong id="interestReceivedTotal">₹0.00</strong>
      </div>

      <button id="addInterestReceivedButton" type="button" class="secondary-button">
        + Add Interest
      </button>

      <form id="interestReceivedForm" hidden>
        <input id="interestReceivedId" type="hidden">

        <label>
          Date
          <input id="interestReceivedDate" type="date" required>
        </label>

        <label>
          Amount
          <input id="interestReceivedAmount" type="number" step="0.01" min="0.01" required>
        </label>

        <label>
          <select id="interestReceivedNote" required>
            <option value="Received">Received</option>
            <option value="Paid">Paid</option>
          </select>
        </label>

        <div class="form-actions">
          <button id="cancelInterestReceivedButton" type="button" class="secondary-button">Cancel</button>
          <button id="interestReceivedSubmitButton" type="submit" class="primary-button">Save</button>
        </div>

        <p id="interestReceivedFormError" class="form-error" hidden></p>
      </form>

      <div id="interestReceivedList" class="interest-received-list"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="editPartyModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editPartyModalTitle">
      <div class="modal-header">
        <div>
          <h2 id="editPartyModalTitle">Edit</h2>
          <p>Update details.</p>
        </div>
        <button id="closeEditPartyModal" class="secondary-button" type="button">×</button>
      </div>

      <form id="editPartyForm">
        <label>
          Name
          <input id="editPartyName" type="text" required maxlength="100" autocomplete="name">
        </label>

        <label>
          Mobile
          <input id="editPartyMobile" type="tel" maxlength="20" autocomplete="tel">
        </label>

        <label>
          Mail Address
          <input id="editPartyEmail" type="email" maxlength="150" autocomplete="email">
        </label>

        <label>
          Address
          <textarea id="editPartyAddress" rows="3" maxlength="250"></textarea>
        </label>

        <div class="form-actions">
          <button id="cancelEditPartyButton" type="button" class="secondary-button">Cancel</button>
          <button type="submit" class="primary-button">Save</button>
        </div>

        <p id="editPartyFormError" class="form-error" hidden></p>
      </form>
    </div>
  </div>
  <div id="modalContainer"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/notify.js"></script>

<script src="/js/toast.js"></script>

<script src="/js/components.js"></script>
  <script src="/js/modal.js"></script>
  <script>

loadComponent(
    "modalContainer",
    "/components/modal.html"
);

</script>
  <script src="/ledger/js/party.js"></script>
</body>
</html>
