<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Party Khata - Ledger</title>
  <link rel="stylesheet" href="/ledger/css/ledger.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a href="/ledger/index.html" class="ledger-book-button" style="text-decoration:none;">
        <span>
          <strong>Back</strong>
        </span>
      </a>
      <div class="section-heading">
          <div>
            <h1 id="partyName"></h1>
            <p id="partyMobile"></p>
          </div>
        </div>
    </header>

    <main class="content">
      <section id="partyLoading" class="empty-state">
        <h2>Loading party...</h2>
      </section>

      <section id="partyError" class="empty-state" hidden>
        <h2>Unable to load party</h2>
        <p></p>
      </section>

      <section id="partyDetails" hidden>

        <article class="summary-card get-card">
          <span class="summary-label" id="partyBalanceLabel">BALANCE</span>
          <strong id="partyBalance">₹0.00</strong>
        </article>

        <button
          class="floating-add"
          id="addTransactionButton"
          type="button"
          style="position:static; width:100%; margin-top:16px;"
        >
          <span>＋</span>
          <span>Add Transaction</span>
        </button>

        <section class="parties-section" style="margin-top:24px;">

          <div id="transactionsList" class="parties-list"></div>
        </section>
      </section>

      <div class="modal-backdrop" id="transactionModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="transactionModalTitle">
          <div class="modal-header">
            <div>
              <h2 id="transactionModalTitle">Add Transaction</h2>
              <p>Record money given or received from this party.</p>
            </div>
            <button id="closeTransactionModal" class="modal-close" type="button">×</button>
          </div>

          <form id="transactionForm">
            <div class="transaction-type-field">
              <span class="transaction-type-label"></span>
              <div class="transaction-type-buttons" role="group" aria-label="Transaction Type">
                <button
                  type="button"
                  class="transaction-type-button"
                  data-transaction-type="debit"
                  aria-pressed="false"
                >YOU GAVE</button>
                <button
                  type="button"
                  class="transaction-type-button"
                  data-transaction-type="credit"
                  aria-pressed="false"
                >YOU GOT</button>
              </div>
              <input type="hidden" id="transactionType" value="debit" required>
            </div>

            <label>
              Amount
              <input id="transactionAmount" type="number" min="0.01" step="0.01" required>
            </label>

            <label>
              Date
              <input id="transactionDate" type="date" required>
            </label>

            <label>
              Note
              <textarea id="transactionDescription" rows="3" maxlength="40"></textarea>
            </label>

            <div class="form-actions">
              <button id="cancelTransactionButton" type="button" class="secondary-button">Cancel</button>
              <button id="transactionSubmitButton" type="submit" class="primary-button">Save Transaction</button>
            </div>

            <p id="transactionFormError" class="form-error" hidden></p>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/ledger/js/party.js"></script>
</body>
</html>
