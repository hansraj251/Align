<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Align Super Admin</title>

    <link rel="stylesheet"
          href="/css/output.css">

</head>

<body>
<script src="/js/components.js"></script>
<script src="/js/superAdminAuth.js"></script>
<script src="/js/superAdminLayout.js"></script>
<script src="/js/notify.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/superAdminDashboard.js"></script>

<script>

loadSuperAdminLayout({

    title: "Dashboard",

    active: "dashboard"

});

document.getElementById("pageContent").innerHTML = `

<div class="space-y-6">

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

        <div class="rounded-2xl bg-white p-6 shadow">

            <div class="text-gray-500">

                Total Restaurants

            </div>

            <div
                id="totalRestaurants"
                class="mt-3 text-4xl font-bold">

                0

            </div>

        </div>

    </div>

    <div class="rounded-2xl bg-white p-6 shadow">

        <div class="flex items-center justify-between">

            <div>

                <h2 class="text-lg font-semibold">

                    Database Backup

                </h2>

                <p class="mt-1 text-sm text-gray-500">

                    Download the latest database backup.

                </p>

            </div>

            <button
    id="downloadBackupBtn"
    class="inline-flex items-center gap-2 rounded-lg bg-slate-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-blue-700">

    <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor">

        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v10m0 0l-4-4m4 4l4-4M5 20h14"/>

    </svg>

    <span>

        Download Backup

    </span>

</button>

        </div>

    </div>

</div>

`;

document
    .getElementById(
        "downloadBackupBtn"
    )
    .addEventListener(

        "click",

        async () => {

            try {

                const response =
                    await fetch(

                        "/api/super-admin/backup",

                        {

                            headers: {

                                Authorization:
                                    `Bearer ${SuperAdminAuth.token()}`

                            }

                        }

                    );

                if (!response.ok) {

                    throw new Error(
                        "Backup download failed."
                    );

                }

                const blob =
                    await response.blob();

                const url =
                    window.URL.createObjectURL(
                        blob
                    );

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    url;

                link.download =
                    "align-backup.zip";

                document.body.appendChild(
                    link
                );

                link.click();

                link.remove();

                window.URL.revokeObjectURL(
                    url
                );

            } catch (err) {

                Notify.error(
                    err.message
                );

            }

        }

    );

loadDashboard();

</script>

</body>

</html>
