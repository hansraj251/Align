<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Attendance Users</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

</head>

<body class="min-h-screen bg-slate-100">

    <div class="min-h-screen">

        <header
            class="sticky top-0 z-50 border-slate-200 bg-white shadow-sm">

            <div
                class="mx-auto flex min-h-[60px] w-full max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:min-h-[72px] sm:px-6 sm:py-4">

                <a
                    href="/school/dashboard.html"
                    class="flex shrink-0 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-200 sm:px-4 sm:py-2.5">

                    <span class="text-lg">
                        ←
                    </span>

                    Back

                </a>

                <button
                    id="addAttendanceUserBtn"
                    type="button"
                    class="rounded-xl bg-blue-600 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700 sm:px-4 sm:py-2.5">

                    + Add Attendance User

                </button>

            </div>

        </header>


        <main
            class="mx-auto w-full max-w-7xl px-4 py-5 sm:px-6 sm:py-8">

            <div
                class="mb-5">

                <h1
                    class="text-xl font-semibold text-slate-800 sm:text-2xl">

                    Attendance Users

                </h1>

                <p
                    class="mt-1 text-sm text-slate-500">

                    Manage users who can mark student attendance.

                </p>

            </div>


            <div
                id="attendanceUserForm"
                class="mb-5 hidden w-full rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:mb-6 sm:p-6">

                <div
                    class="mb-5 flex items-center justify-between border-b border-slate-100 pb-4">

                    <div>

                        <h2
                            class="text-lg font-semibold text-slate-800">

                            Create Attendance User

                        </h2>

                        <p
                            class="mt-1 text-sm text-slate-500">

                            Create a User ID and password for attendance marking.

                        </p>

                    </div>

                    <button
                        id="closeAttendanceUserFormBtn"
                        type="button"
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-2xl leading-none text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">

                        ×

                    </button>

                </div>


                <form
                    id="attendanceUserFormElement">

                    <div
                        class="grid grid-cols-1 gap-4 sm:grid-cols-2">

                        <div>

    <label
        class="mb-2 block text-sm font-medium text-slate-700">

        Staff

    </label>

    <select
        id="attendanceTeacher"
        required
        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

        <option value="">
            Select staff
        </option>

    </select>

</div>
<div>

    <label
        class="mb-2 block text-sm font-medium text-slate-700">

        Classes

    </label>

    <select
        id="attendanceClasses"
        multiple
        required
        size="5"
        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

    </select>

    <p
        class="mt-1 text-xs text-slate-500">

        Hold Ctrl or Cmd to select multiple classes.

    </p>

</div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                User ID

                            </label>

                            <input
                                id="attendanceUsername"
                                type="text"
                                required
                                autocomplete="username"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Password

                            </label>

                            <input
                                id="attendanceUserPassword"
                                type="password"
                                required
                                minlength="8"
                                autocomplete="new-password"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                    </div>


                    <p
                        id="attendanceUserFormResult"
                        class="mt-4 text-sm">
                    </p>


                    <div
                        class="mt-5 flex justify-end gap-3">

                        <button
                            id="cancelAttendanceUserBtn"
                            type="button"
                            class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-200">

                            Cancel

                        </button>

                        <button
                            type="submit"
                            class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">

                            Create User

                        </button>

                    </div>

                </form>

            </div>


            <div
                class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

                <div
                    class="border-b border-slate-100 px-5 py-4">

                    <h2
                        class="font-semibold text-slate-800">

                        Attendance Users

                    </h2>

                </div>


                <div
                    class="overflow-x-auto">

                    <table
                        class="min-w-full">

                        <thead
                            class="bg-slate-50">

                            <tr>

                                <th
                                    class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">

                                    Name

                                </th>

                                <th
                                    class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">

                                    User ID

                                </th>

                                <th
                                    class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">

                                    Status

                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="attendanceUsersBody">

                            <tr>

                                <td
                                    colspan="3"
                                    class="px-5 py-8 text-center text-sm text-slate-500">

                                    No attendance users found.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>


<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/attendanceUsers.js"></script>

</body>

</html>
