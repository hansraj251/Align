<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pending Salary</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

</head>

<body class="min-h-screen bg-slate-100">

<main class="min-h-screen">

    <header
    class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">

    <div
        class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 md:px-6">

        <div
            class="flex items-center">

            <button
                type="button"
                onclick="history.back()"
                class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-200">

                <span class="text-lg">
                    ←
                </span>

                Back

            </button>

        </div>

        <a
            href="/school/salary-history.html"
            class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-200">

            Salary History

        </a>

    </div>

</header>

    <div
        class="mx-auto max-w-7xl p-4 md:p-6 xl:p-8">

        <div
            class="mb-6">

            <h2
                class="text-2xl font-bold text-slate-800">

                Salary Payment

            </h2>

            <p
                id="salaryMonth"
                class="mt-1 text-sm text-slate-500">

                Loading...

            </p>

        </div>

        <div
            class="mb-6 grid gap-4 md:grid-cols-3">

            <div
                class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

                <p
                    class="text-sm font-medium text-slate-500">

                    Total Salary

                </p>

                <p
                    id="totalSalary"
                    class="mt-2 text-2xl font-bold text-slate-800">

                    ₹0

                </p>

            </div>

            <div
                class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5 shadow-sm">

                <p
                    class="text-sm font-medium text-emerald-600">

                    Paid

                </p>

                <p
                    id="totalPaid"
                    class="mt-2 text-2xl font-bold text-emerald-700">

                    ₹0

                </p>

            </div>

            <div
                class="rounded-2xl border border-amber-200 bg-amber-50 p-5 shadow-sm">

                <p
                    class="text-sm font-medium text-amber-600">

                    Pending

                </p>

                <p
                    id="pendingAmount"
                    class="mt-2 text-2xl font-bold text-amber-700">

                    ₹0

                </p>

            </div>

        </div>

        <div
            class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

            <div
                class="border-b border-slate-200 px-5 py-4">

                <h3
                    class="font-semibold text-slate-800">

                    Staff Salary

                </h3>

            </div>

            <div
                class="overflow-x-auto">

                <table
                    class="w-full min-w-[800px]">

                    <thead
                        class="bg-slate-50">

                        <tr>

                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">

                                Employee

                            </th>

                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">

                                Staff

                            </th>

                            <th
                                class="px-4 py-3 text-left text-xs font-semibold uppercase text-slate-500">

                                Designation

                            </th>

                            <th
                                class="px-4 py-3 text-right text-xs font-semibold uppercase text-slate-500">

                                Salary

                            </th>

                            <th
                                class="px-4 py-3 text-right text-xs font-semibold uppercase text-slate-500">

                                Paid

                            </th>

                            <th
                                class="px-4 py-3 text-right text-xs font-semibold uppercase text-slate-500">

                                Pending

                            </th>

                            <th
                                class="px-4 py-3 text-right text-xs font-semibold uppercase text-slate-500">

                                Action

                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="salaryTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="px-4 py-8 text-center text-sm text-slate-500">

                                Loading...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <p
            id="result"
            class="mt-4 text-sm font-medium">

        </p>

    </div>
    <div
    id="salaryPaymentModal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/50 p-4">

    <div
        class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">

        <div
            class="mb-6 flex items-start justify-between">

            <div>

                <h2
                    class="text-xl font-bold text-slate-800">

                    Pay Salary

                </h2>

                <p
                    id="paymentStaffName"
                    class="mt-1 text-sm text-slate-500">

                </p>

            </div>

            <button
                type="button"
                onclick="closeSalaryPayment()"
                class="rounded-lg px-3 py-1 text-xl text-slate-400 hover:bg-slate-100 hover:text-slate-700">

                ×

            </button>

        </div>

        <form id="salaryPaymentForm">

            <input
                id="paymentTeacherId"
                type="hidden">

            <div
                class="mb-4 rounded-xl bg-slate-50 p-4">

                <div
                    class="flex justify-between text-sm">

                    <span
                        class="text-slate-500">

                        Salary

                    </span>

                    <span
                        id="paymentSalaryAmount"
                        class="font-semibold text-slate-800">

                        ₹0

                    </span>

                </div>

                <div
                    class="mt-2 flex justify-between text-sm">

                    <span
                        class="text-slate-500">

                        Already Paid

                    </span>

                    <span
                        id="paymentAlreadyPaid"
                        class="font-semibold text-emerald-600">

                        ₹0

                    </span>

                </div>

                <div
                    class="mt-2 flex justify-between border-t border-slate-200 pt-2">

                    <span
                        class="font-medium text-slate-700">

                        Outstanding

                    </span>

                    <span
                        id="paymentPendingAmount"
                        class="font-bold text-amber-600">

                        ₹0

                    </span>

                </div>

            </div>

            <div
                class="mb-4">

                <label
                    for="salaryAmountInput"
                    class="mb-2 block text-sm font-semibold text-slate-700">

                    Payment Amount

                </label>

                <input
                    id="salaryAmountInput"
                    type="number"
                    min="1"
                    step="0.01"
                    required
                    class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

            </div>

            <div
                class="mb-4">

                <label
                    for="salaryPaymentDate"
                    class="mb-2 block text-sm font-semibold text-slate-700">

                    Payment Date

                </label>

                <input
                    id="salaryPaymentDate"
                    type="date"
                    required
                    class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

            </div>

            <div
                class="mb-4">

                <label
                    for="salaryPaymentMode"
                    class="mb-2 block text-sm font-semibold text-slate-700">

                    Payment Mode

                </label>

                <select
                    id="salaryPaymentMode"
                    class="w-full rounded-xl border border-slate-300 bg-white p-3 text-slate-800 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                    <option value="">
                        Select Payment Mode
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Bank Transfer">
                        Bank Transfer
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Cheque">
                        Cheque
                    </option>

                </select>

            </div>

            <div
                class="mb-4">

                <label
                    for="salaryReferenceNo"
                    class="mb-2 block text-sm font-semibold text-slate-700">

                    Reference No.

                </label>

                <input
                    id="salaryReferenceNo"
                    type="text"
                    placeholder="Optional"
                    class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

            </div>

            <div
                class="mb-5">

                <label
                    for="salaryRemarks"
                    class="mb-2 block text-sm font-semibold text-slate-700">

                    Remarks

                </label>

                <textarea
                    id="salaryRemarks"
                    rows="2"
                    placeholder="Optional"
                    class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100"></textarea>

            </div>

            <p
                id="paymentResult"
                class="mb-4 text-sm font-medium">

            </p>

            <div
                class="flex justify-end gap-3">

                <button
                    type="button"
                    onclick="closeSalaryPayment()"
                    class="rounded-xl border border-slate-300 px-5 py-3 font-medium text-slate-700 hover:bg-slate-200">

                    Cancel

                </button>

                <button
                    id="submitSalaryPaymentBtn"
                    type="submit"
                    class="rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-700">

                    Pay Salary

                </button>

            </div>

        </form>

    </div>

</div>

</main>

<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/pendingSalary.js"></script>

</body>

</html>
