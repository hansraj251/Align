<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Students</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

</head>

<body class="min-h-screen bg-slate-100">

    <main class="min-h-screen">

        <header
    class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">

            <div
    class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-3 sm:px-6 sm:py-4">
                <div
    class="flex min-w-0 items-center gap-2 sm:gap-4">

                    <button
    type="button"
    onclick="history.back()"
    class="flex shrink-0 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-200 sm:px-4">
                        <span class="text-lg">
                            ←
                        </span>

                        Back

                    </button>

                    <div
                        class="hidden h-8 w-px bg-slate-200 sm:block">
                    </div>

                </div>
                 <button
        id="addStudentBtn"
        type="button"
        class="shrink-0 rounded-xl bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 sm:px-5 sm:py-3">
        + Add Student
    </button>

            </div>

        </header>

        <section
    class="mx-auto max-w-7xl px-4 py-5 sm:px-6 sm:py-8">

            <div
                id="studentForm"
                class="mb-5 hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:mb-6 sm:p-6">

                <div
    class="mb-5 flex items-center justify-between border-slate-100 pb-4 sm:mb-6">
                    <div>

                        <h2
                            id="studentFormTitle"
                            class="mt-1 text-xl font-semibold text-slate-800">

                            Add Student

                        </h2>

                    </div>

                    <button
                        id="closeFormBtn"
                        type="button"
                        class="flex h-9 w-9 items-center justify-center rounded-lg text-xl text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">

                        &times;

                    </button>

                </div>

                <form id="studentFormElement">

                    <div
    class="grid grid-cols-1 gap-4 sm:gap-5 md:grid-cols-2">

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Admission Number

                            </label>

                            <input
                                id="admissionNo"
                                required
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Student Name

                            </label>

                            <input
                                id="studentName"
                                required
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Father's Name

                            </label>

                            <input
                                id="fatherName"
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Mother's Name

                            </label>

                            <input
                                id="motherName"
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Date of Birth

                            </label>

                            <input
                                id="dob"
                                type="date"
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Gender

                            </label>

                            <select
                                id="gender"
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                                <option value="">
                                    Select Gender
                                </option>

                                <option value="male">
                                    Male
                                </option>

                                <option value="female">
                                    Female
                                </option>

                                <option value="other">
                                    Other
                                </option>

                            </select>

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Mobile

                            </label>

                            <input
                                id="mobile"
                                type="tel"
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Class

                            </label>

                            <select
                                id="className"
                                required
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                                <option value="">
                                    Select Class
                                </option>

                            </select>

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Section

                            </label>

                            <select
                                id="section"
                                required
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                                <option value="">
                                    Select Section
                                </option>

                            </select>

                        </div>

                        <div>

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Roll Number

                            </label>

                            <input
                                id="rollNo"
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div
                            class="md:col-span-2">

                            <label
                                class="mb-1.5 block text-sm font-medium text-slate-700">

                                Address

                            </label>

                            <textarea
                                id="address"
                                rows="3"
                                class="w-full rounded-xl border border-slate-300 bg-white p-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"></textarea>

                        </div>


                    </div>

                    <div
                        id="formResult"
                        class="mt-4 text-sm font-medium">
                    </div>


                    <div
                        class="mt-5 flex flex-col-reverse gap-3 border-slate-100 pt-5 sm:flex-row sm:justify-end sm:gap-3 sm:pt-5">

                        <button
                            type="button"
                            id="cancelStudentBtn"
                            class="w-full rounded-xl bg-slate-100 px-5 py-3 text-center font-medium text-slate-700 transition hover:bg-slate-200 sm:w-auto">

                            Cancel

                        </button>

                        <button
                            type="submit"
                            class="w-full rounded-xl bg-blue-600 px-5 py-3 text-center font-semibold text-white shadow-sm transition hover:bg-blue-700 sm:w-auto">

                            Save Student

                        </button>

                    </div>

                </form>

            </div>

            <div
                class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

                <div
                    class="flex flex-col gap-3 border-b border-slate-100 px-6 py-5 sm:flex-row sm:items-center sm:justify-between">

                    <div>

                        <h2
                            class="font-semibold text-slate-800">

                            All Students

                        </h2>

                        <p
                            class="mt-1 text-sm text-slate-500">

                            Students registered in the school.

                        </p>

                    </div>

                </div>

                <div
                    class="overflow-x-auto">

                    <table
    class="min-w-full text-sm">

                        <thead
                            class="bg-slate-50">

                            <tr>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Admission No.

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Student

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Class

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Section

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Roll No.

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Status

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Actions

                                </th>

                            </tr>

                        </thead>

                        <tbody
                            id="studentsTableBody">

                            <tr>

                                <td
                                    colspan="7"
                                    class="px-6 py-10 text-center text-slate-500">

                                    Loading students...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>
<div id="modalContainer"></div>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/modal.js"></script>

<script>

loadComponent(
    "modalContainer",
    "/components/modal.html"
);

</script>
<script src="/js/students.js"></script>
</body>
