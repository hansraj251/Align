<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

<body class="bg-slate-100">

    <div class="flex h-screen flex-col">

        <!-- Mobile Header -->

        <header

            <button

                ☰

        </header>


        <!-- Sidebar Overlay -->

        <div
            id="sidebarOverlay"
            class="fixed inset-0 z-40 hidden bg-black/50 md:hidden">
        </div>


        <div class="flex h-screen overflow-hidden">


            <!-- Sidebar -->

            <aside

                class="fixed left-0 top-0 z-50 flex h-screen w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-300 md:static md:translate-x-0">

                <!-- Sidebar Header -->

                <!-- Sidebar Header -->

<div

                id="sidebarSchoolLogo"

            <span
                id="sidebarSchoolLogoPlaceholder"
                class="text-xs text-slate-400">

                Logo

            </span>

        </div>

        <button
            id="closeSidebarBtn"
            type="button"

    </div>

</div>


                <!-- Navigation -->

                        <a

                              Manage Fees

                        </a>


                        <!-- Teachers -->

                        <a
                            href="/school/teachers.html"

                            class="block rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 font-medium text-slate-700 transition duration-200 hover:border-slate-300 hover:bg-slate-100 hover:shadow-sm">

                            Add Staff

                        </a>

                        <a
                            href="/school/salary.html"

                        <a

                    </div>

                </nav>


                <!-- Logout -->

                <div

                    <button

                        🚪 Logout

                    </button>

                </div>

            </aside>


            <!-- Main -->

            <main
    class="flex-1 overflow-y-auto pt-0">

     <div

    <div

        <div

            </div>

    id="schoolName"

</h1>

            </div>

            <div

        </div>

</div>


                <!-- Dashboard Content -->

                <section

                    <!-- Stats -->

                    <div

                        <!-- Students -->

                        <a
    href="/school/attendance.html"

    </p>

        --

    </p>

</a>
<a
    href="/school/fees.html"
    class="block rounded-xl bg-white p-4 shadow transition duration-200 hover:-translate-y-1 hover:shadow-lg md:p-5 xl:p-6">

    <p
        class="text-sm text-slate-500">

        Pending Fees

    </p>

    <p
        id="pendingFees"
        class="mt-3 text-2xl font-bold text-red-600 md:text-3xl">

        ₹0

    </p>

</a>
<a
    href="/school/pending-salary.html"
    class="block rounded-xl bg-white p-4 shadow transition duration-200 hover:-translate-y-1 hover:shadow-lg md:p-5 xl:p-6">

    <p
        class="text-sm text-slate-500">

        Pending Salaries

    </p>

    <p
    id="pendingSalaries"
    class="mt-3 text-2xl font-bold text-red-600 md:text-3xl">

        ₹0

    </p>

</a>
                        <a
                           href="/school/studentDetails.html"
                            class="block rounded-xl bg-white p-4 shadow transition duration-200 hover:-translate-y-1 hover:shadow-lg md:p-5 xl:p-6">

                            <p
                                class="text-sm text-slate-500">

                                Students

                            </p>
                            <p
                                id="studentsCount"
                                class="mt-3 text-2xl font-bold text-slate-800 md:text-3xl">

                                0

                            </p>

                        </a>


                        <!-- Teachers -->

                        <a
                            href="/school/teachers.html"
                            class="block rounded-xl bg-white p-4 shadow transition duration-200 hover:-translate-y-1 hover:shadow-lg md:p-5 xl:p-6">

                            <p
                                class="text-sm text-slate-500">

                                Staff

                            </p>

                            <p
                                 id="staffCount"
                                class="mt-3 text-2xl font-bold text-slate-800 md:text-3xl">

                                0

                            </p>

                        </a>


                        <!-- Classes -->

                      <div
    class="col-span-full rounded-xl bg-white p-4 shadow md:p-5 xl:p-6">

    <div
        class="mb-4 flex items-center justify-between">

        <div>

            <p
                class="text-sm text-slate-500">

                Classes

            </p>

        </div>

        <a
            href="/school/classes.html"
            class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-200">

            Manage

        </a>

    </div>

    <div
        id="dashboardClasses"
        class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">

        <p
            class="text-sm text-slate-500">

            Loading classes...

        </p>

    </div>

</div>

                    </div>



    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>

<script src="/js/schoolDashboard.js"></script>


    <script>

        const sidebar =
            document.getElementById(
                "sidebar"
            );

        const sidebarOverlay =
            document.getElementById(
                "sidebarOverlay"
            );

        const mobileMenuBtn =
            document.getElementById(
                "mobileMenuBtn"
            );

        const closeSidebarBtn =
            document.getElementById(
                "closeSidebarBtn"
            );


        function openSidebar() {

            sidebar.classList.remove(
                "-translate-x-full"
            );

            sidebarOverlay.classList.remove(
                "hidden"
            );

        }


        function closeSidebar() {

            sidebar.classList.add(
                "-translate-x-full"
            );

            sidebarOverlay.classList.add(
                "hidden"
            );

        }


        mobileMenuBtn.addEventListener(
            "click",
            openSidebar
        );


        closeSidebarBtn.addEventListener(
            "click",
            closeSidebar
        );


        sidebarOverlay.addEventListener(
            "click",
            closeSidebar
        );


        document
            .querySelectorAll(
                "#sidebar a"
            )
            .forEach(
                link => {

                    link.addEventListener(
                        "click",
                        () => {

                            if (
                                window.innerWidth <
                                768
                            ) {

                                closeSidebar();

                            }

                        }
                    );

                }
            );

    </script>

</body>

</html>
