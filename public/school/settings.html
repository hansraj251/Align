<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>School Settings</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

</head>

<body class="min-h-screen bg-slate-100">

<div class="min-h-screen lg:flex">

    <!-- Main -->

    <main
        class="flex-1 overflow-y-auto">

        <!-- Mobile Header -->

        <header
    class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">

            <div
                class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

                <div
                    class="flex items-center gap-4">

                    <button
                        type="button"
                        onclick="history.back()"
                        class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-200">

                        <span class="text-lg">
                            ←
                        </span>

                        Back

                    </button>

                </div>

            </div>

        </header>

        <div
    class="w-full p-4 md:p-6 xl:p-8">

            <div
                class="mb-6">

                <h1
                    class="text-2xl font-bold text-slate-800 md:text-3xl">

                    School Profile

                </h1>

            </div>

            <div
                class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">

                <form id="settingsForm">

                    <div
                        class="mb-8">

                        <h2
                            class="text-lg font-semibold text-slate-800">

                            School Information

                        </h2>


                    </div>

                    <div
    class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">

                        <div>

                            <label
                                for="schoolName"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                School Name

                            </label>

                            <input
                                id="schoolName"
                                type="text"
                                class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                for="ownerName"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                Owner Name

                            </label>

                            <input
                                id="ownerName"
                                type="text"
                                class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                for="email"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                Email Address

                            </label>

                            <input
                                id="email"
                                type="email"
                                readonly
                                class="w-full cursor-not-allowed rounded-xl border border-slate-200 bg-slate-100 p-3 text-slate-500">

                        </div>

                        <div>

                            <label
                                for="mobile"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                Mobile Number

                            </label>

                            <input
                                id="mobile"
                                type="tel"
                                class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div
                            class="md:col-span-2">

                            <label
                                for="address"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                Address

                            </label>

                            <textarea
                                id="address"
                                rows="3"
                                class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"></textarea>

                        </div>

                        <div>

                            <label
                                for="city"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                City

                            </label>

                            <input
                                id="city"
                                type="text"
                                class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                for="state"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                State

                            </label>

                            <input
                                id="state"
                                type="text"
                                class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                for="pincode"
                                class="mb-2 block text-sm font-semibold text-slate-700">

                                Pincode

                            </label>

                            <input
                                id="pincode"
                                type="text"
                                class="w-full rounded-xl border border-slate-300 p-3 text-slate-800 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                        </div>

                    </div>

                    <div
                        class="mt-8 flex items-center justify-between border-t border-slate-200 pt-6">

                        <p
                            id="result"
                            class="text-sm font-medium">

                        </p>

                        <button
                            id="saveBtn"
                            type="submit"
                            class="rounded-xl bg-slate-600 px-6 py-3 font-semibold text-white transition hover:bg-blue-700 active:scale-95">

                            Save Changes

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/schoolSettings.js"></script>

</body>

</html>
