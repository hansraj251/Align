<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Attendance History</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

</head>

<body class="min-h-screen bg-slate-100">

    <main class="min-h-screen">

      <header
    class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">

    <div
        class="mx-auto flex w-full max-w-7xl flex-wrap items-center gap-3 px-4 py-3 sm:flex-nowrap sm:justify-between sm:px-6 sm:py-4">

        <div
            class="flex min-w-0 shrink-0 items-center gap-2 sm:gap-4">

            <button
                type="button"
                onclick="history.back()"
                class="flex min-w-[72px] shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700 transition hover:bg-slate-200 sm:min-w-0 sm:gap-2 sm:px-4 sm:py-2.5 sm:text-sm">

                <span class="text-base">
                    ←
                </span>

                Back

            </button>

            <div
                class="hidden h-8 w-px bg-slate-200 sm:block">
            </div>

        </div>


        <div
            class="flex w-full min-w-0 flex-wrap items-center gap-2 sm:w-auto sm:flex-none">

            <div
                class="min-w-0 flex-1 sm:flex-none">

                <label
                    for="startDate"
                    class="sr-only">

                    Start Date

                </label>

                <input
                    id="startDate"
                    type="date"
                    class="w-full rounded-xl border border-slate-300 bg-white px-2.5 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100 sm:w-auto sm:px-3">

            </div>


            <div
                class="min-w-0 flex-1 sm:flex-none">

                <label
                    for="endDate"
                    class="sr-only">

                    End Date

                </label>

                <input
                    id="endDate"
                    type="date"
                    class="w-full rounded-xl border border-slate-300 bg-white px-2.5 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100 sm:w-auto sm:px-3">

            </div>

        </div>

    </div>

</header>


        <section
    class="mx-auto w-full max-w-7xl px-4 py-4 sm:px-6 sm:py-8">

                <p
                    id="historyResult"
                    class="mt-4 text-sm">
                </p>
<div
                class="min-w-0">

                <h1
                    id="studentName"
                    class="truncate text-base font-semibold text-slate-800 sm:text-lg">

                    Attendance History

                </h1>

                <p
                    id="studentDetails"
                    class="truncate text-xs text-slate-500">

                    Loading student...

                </p>

            </div>

            <div
    class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-3">

                <div
                    class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

                    <p
                        class="text-sm text-slate-500">

                        Total Days

                    </p>

                    <p
                        id="totalDays"
                        class="mt-2 text-2xl font-bold text-slate-800">

                        0

                    </p>

                </div>

                <div
                    class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

                    <p
                        class="text-sm text-slate-500">

                        Present

                    </p>

                    <p
                        id="presentDays"
                        class="mt-2 text-2xl font-bold text-emerald-600">

                        0

                    </p>

                </div>

                <div
                    class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">

                    <p
                        class="text-sm text-slate-500">

                        Absent

                    </p>

                    <p
                        id="absentDays"
                        class="mt-2 text-2xl font-bold text-red-600">

                        0

                    </p>

                </div>

            </div>


            <div
                class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

                <div
                    class="border-b border-slate-200 px-6 py-4">

                    <h2
                        class="font-semibold text-slate-800">

                        Attendance Records

                    </h2>

                </div>


                <div
    class="w-full overflow-x-auto">

    <table
        class="min-w-[600px] w-full">

                        <thead
                            class="bg-slate-50">

                            <tr>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6">

                                    Date

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6">

                                    Status

                                </th>

                            </tr>

                        </thead>

                        <tbody
                            id="historyTableBody">

                            <tr>

                                <td
                                    colspan="3"
                                    class="px-4 py-10 text-center text-sm text-slate-500 sm:px-6">

                                    Loading attendance history...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>

    <script src="/js/attendance-history.js"></script>

</body>

</html>
