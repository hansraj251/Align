<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Attendance</title>

    <link
        rel="stylesheet"
        href="/css/output.css">


</head>

<body class="min-h-screen bg-slate-100">

    <main class="min-h-screen">

        <header
            class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">

            <div
                class="mx-auto flex w-full max-w-7xl flex-wrap items-center gap-2 px-4 py-3 sm:flex-nowrap sm:justify-between sm:gap-4 sm:px-6 sm:py-4">

                <div
                    class="flex min-w-0 shrink-0 items-center gap-2 sm:gap-4">

                    <button
                        type="button"
                        onclick="history.back()"
                        class="flex min-w-[72px] shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700 shadow-sm transition hover:bg-slate-200 sm:min-w-0 sm:gap-2 sm:px-4 sm:py-2.5 sm:text-sm">

                        <span class="text-base">
                            ←
                        </span>

                        Back

                    </button>

                    <div
                        class="hidden h-8 w-px bg-slate-200 sm:block">
                    </div>

                    <p
                        class="hidden text-xs text-slate-500 sm:block">

                        Mark daily student attendance

                    </p>

                </div>


                <div
                    class="flex min-w-0 flex-1 items-center gap-2 sm:flex-none">

                    <div
                        class="min-w-0 flex-1 sm:flex-none">

                        <label
                            for="studentSearch"
                            class="sr-only">

                            Search Student

                        </label>

                        <input
                            id="studentSearch"
                            type="search"
                            placeholder="Search student..."
                            autocomplete="off"
                            class="w-full min-w-0 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100 sm:w-48">

                    </div>

                    <div
    id="attendanceDateContainer"
    class="shrink-0">

                        <label
                            for="attendanceDate"
                            class="sr-only">

                            Attendance Date

                        </label>

                        <input
                            id="attendanceDate"
                            type="date"
                            max=""
                            class="w-[125px] rounded-xl border border-slate-300 bg-white px-2.5 py-2 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100 sm:w-auto sm:px-3">

                    </div>

                </div>


                <div
    class="flex w-full shrink-0 items-center gap-2 sm:w-auto">

    <button
        id="holidayBtn"
        type="button"
        class="flex-1 whitespace-nowrap rounded-xl bg-amber-500 px-3 py-2 text-xs font-semibold text-white transition hover:bg-amber-600 sm:flex-none sm:px-4 sm:text-sm">

        Mark Holiday

    </button>

    <button
        id="markAllPresentBtn"
        type="button"
        class="flex-1 whitespace-nowrap rounded-xl bg-emerald-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-emerald-700 sm:flex-none sm:px-4 sm:text-sm">

        Mark All Present

    </button>

</div>

            </div>

        </header>


        <section
            class="mx-auto w-full max-w-7xl px-4 py-4 sm:px-6 sm:py-8">

            <p
                id="attendanceResult"
                class="mt-4 text-sm">
            </p>


            <div
                class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

                <div
                    class="border-b border-slate-200 px-4 py-4 sm:px-6">

                    <p
                        id="attendanceSummary"
                        class="text-sm text-slate-500">

                        Loading students...

                    </p>

                </div>


                <div
                    class="w-full overflow-x-auto">

                    <table
                        class="min-w-[520px] w-full">

                        <thead
                            class="bg-slate-50">

                            <tr>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6">

                                    Student

                                </th>

                                <th
    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6">

    Class / Section

</th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-center text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6">

                                    Attendance

                                </th>

                            </tr>

                        </thead>

                        <tbody
                            id="attendanceStudentTableBody">

                            <tr>

                                <td
                                    colspan="4"
                                    class="px-4 py-10 text-center text-sm text-slate-500 sm:px-6">

                                    Loading students...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>

    <script src="/js/attendance.js"></script>

</body>

</html>
